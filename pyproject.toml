[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meet-notes-auto-joiner"
version = "0.1.0"
description = "Join Aqeel's scheduled Google Meet calls, start Gemini notes, and leave."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.140",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "playwright==1.64.1",
  "PyYAML>=6",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
meet-notes = "meet_notes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
